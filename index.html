<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to My Interactive Web Page! </h1>
        <button id="modeToggle">Toggle Light/Dark Mode</button>
    </header>

    <section>
        <h2>Interactive Counter Game </h2>
        <button id="incrementBtn">Click Me!</button>
        <p>Counter: <span id="counter">0</span></p>
    </section>

    <section>
        <h2>Collapsible FAQ Section</h2>
        <div class="faq">
            <button class="faq-question">What is JavaScript?</button>
            <p class="faq-answer">JavaScript is a programming language for the web.</p>
        </div>
        <div class="faq">
            <button class="faq-question">What is DOM?</button>
            <p class="faq-answer">The DOM is the Document Object Model, which represents your web page.</p>
        </div>
    </section>

    <section>
        <h2>Sign Up Form </h2>
        <form id="signupForm">
            <label>Name: <input type="text" id="name" /></label><br>
            <label>Email: <input type="email" id="email" /></label><br>
            <label>Password: <input type="password" id="password" /></label><br>
            <button type="submit">Submit</button>
        </form>
        <p id="formMessage"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
